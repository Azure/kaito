[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaito-streaming"
version = "0.1.0"
description = "Reusable SSE framing and OpenAI chat streaming utilities"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["kaito_streaming*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py311"
