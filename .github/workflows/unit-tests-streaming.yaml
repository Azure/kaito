name: Streaming Core Tests

on:
  push:
    branches: [main]
    paths:
      - "streaming_core/**"
      - ".github/workflows/unit-tests-streaming.yaml"
      - "pyproject.toml"
  pull_request:
    branches: [main, release-**]
    paths:
      - "streaming_core/**"
      - ".github/workflows/unit-tests-streaming.yaml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true

      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install build==1.2.2.post1
          python -m build --wheel --outdir "$RUNNER_TEMP/streaming-dist" ./streaming_core

      - name: Install and test outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv streaming-venv
          streaming-venv/bin/python -m pip install pytest==8.4.2
          streaming-venv/bin/python -m pip install --no-index --no-deps streaming-dist/*.whl
          cp -r "$GITHUB_WORKSPACE/streaming_core/tests" streaming-tests
          streaming-venv/bin/python -I -c 'from importlib.metadata import requires; import kaito_streaming; assert not requires("kaito-streaming"); print(kaito_streaming.__file__)'
          streaming-venv/bin/python -I -m pytest streaming-tests -q
